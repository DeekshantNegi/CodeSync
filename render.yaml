services:
  - type: web
    name: codesync-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: codesync-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: codesync-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: codesync-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: codesync-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: codesync-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://codesync-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://codesync-frontend.onrender.com

  - type: web
    name: codesync-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://codesync-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: wss://codesync-backend.onrender.com/ws

databases:
  - name: codesync-db
    plan: free