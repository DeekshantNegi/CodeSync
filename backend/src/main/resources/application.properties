spring.application.name=Backend
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:CodeSync}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456789}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

server.port=${PORT:8080}
codesync.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-256-bit-value}
codesync.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
codesync.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
codesync.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5177,http://localhost:5178}